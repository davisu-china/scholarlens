[project]
name = "scholarlens"
version = "0.1.0"
description = "可溯源的学术深度研究引擎 · Traceable academic deep-research engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # web / api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sse-starlette>=2.1",
    "python-jose[cryptography]>=3.3",      # JWT
    "python-multipart>=0.0.12",            # file upload
    # async task queue
    "celery>=5.4",
    "redis>=5.2",
    # storage
    "sqlalchemy>=2.0",
    "greenlet>=3.0",                        # SQLAlchemy async 运行时需要
    "alembic>=1.14",
    "psycopg[binary]>=3.2",                # PostgreSQL
    "qdrant-client>=1.12",                 # vector store
    "neo4j>=5.26",                         # citation graph
    "minio>=7.2",                          # object store
    # ai / retrieval
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "litellm>=1.52",                       # unified LLM gateway
    "rank-bm25>=0.2.2",
    # ingestion / parsing (heavy; install extras as needed)
    # "magic-pdf",   # MinerU — install per its own guide (GPU)
    # observability
    "langfuse>=5,<6",                       # 可观测（OTEL SDK；v4 的旧 ingest 已停用）
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 本地模型（BGE-M3 向量化/重排 + DeBERTa 引用校验）。默认走云 API，无需安装；
# 需要时：uv sync --extra local-models，并设 SL_NLI_MODE=deberta
local-models = [
    "FlagEmbedding>=1.3",                  # BGE-M3 / bge-reranker
    "transformers>=4.46",                  # DeBERTa-NLI
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "apps"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
