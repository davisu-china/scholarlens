name: scholarlens

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scholarlens
      POSTGRES_PASSWORD: scholarlens
      POSTGRES_DB: scholarlens
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant_data:/qdrant/storage"]

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/scholarlens
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  # 应用服务（api / worker / web）在各自 Dockerfile 就绪后取消注释
  # api:
  #   build: { context: .., dockerfile: deploy/Dockerfile.api }
  #   env_file: ../.env
  #   ports: ["8000:8000"]
  #   depends_on: [postgres, qdrant, neo4j, minio, redis]

volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
  minio_data:
